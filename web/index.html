<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Samachar: bilingual Hindi + English news from across India.">
  <meta name="theme-color" content="#1E3A8A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Samachar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Samachar - Hindi + English News</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #1E3A8A; }
    #splash {
      position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #1E3A8A; color: #fff;
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; transition: opacity .35s;
    }
    #splash .logo { width: 84px; height: 84px; border-radius: 20px; background: #2563EB;
      display: flex; align-items: center; justify-content: center; font-size: 46px; font-weight: 700; }
    #splash h1 { margin: 18px 0 4px; font-size: 26px; letter-spacing: .5px; }
    #splash p { margin: 0 0 26px; opacity: .8; font-size: 14px; }
    #splash .bar { width: 160px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); overflow: hidden; }
    #splash .bar i { display: block; width: 40%; height: 100%; background: #fff; border-radius: 2px;
      animation: slide 1.1s infinite ease-in-out; }
    @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    #slow { margin-top: 22px; font-size: 13px; opacity: 0; transition: opacity .4s; text-align: center; padding: 0 24px; }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo">स</div>
    <h1>Samachar</h1>
    <p>समाचार &middot; Hindi + English news</p>
    <div class="bar"><i></i></div>
    <div id="slow">First load downloads the app. This only happens once, then it opens instantly.</div>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('splash');
      function hide() {
        if (!splash) return;
        splash.style.opacity = '0';
        setTimeout(function () { if (splash) { splash.remove(); splash = null; } }, 400);
      }
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(function () { var s = document.getElementById('slow'); if (s) s.style.opacity = '.85'; }, 6000);
    })();
  </script>
  <script src="bridge.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
